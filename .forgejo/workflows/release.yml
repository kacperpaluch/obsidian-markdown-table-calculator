name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: |
          manifest_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version)")"
          package_version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          tag_version="${GITHUB_REF_NAME}"

          if [ "$manifest_version" != "$tag_version" ]; then
            echo "manifest.json version ($manifest_version) does not match tag ($tag_version)."
            exit 1
          fi

          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match tag ($tag_version)."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          ASSETS="main.js manifest.json styles.css"

          RELEASE_ID=$(curl -sS -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/releases/tags/$TAG" | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ]; then
            echo "Updating existing release (id=$RELEASE_ID)"
            for file in $ASSETS; do
              echo "  Uploading $file..."
              curl -sS -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$file" > /dev/null
            done
          else
            echo "Creating new release for $TAG"
            RELEASE_ID=$(curl -sS -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
              "$API/repos/$REPO/releases" | jq -r '.id')

            for file in $ASSETS; do
              echo "  Uploading $file..."
              curl -sS -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file" \
                "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$file" > /dev/null
            done
          fi
